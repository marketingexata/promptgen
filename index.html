=====================================================================
 PROMPT GENERATOR DESAIN - satu file HTML, siap copy-paste
 Cara pakai: simpan sebagai .html lalu buka di browser (HP / desktop)
 Bagian yang mudah diedit (cari komentar "EDIT"):
   1. WARNA & TEMA ........ CSS bagian ":root"

   5. DAFTAR PARAMETER .... JS variabel KEYS dan blok HTML "Parameter"
=====================================================================
-->

/* EDIT 1: warna tema. --a dan --b adalah warna aksen; blok media di bawahnya = tema terang */
:root{--bg1:#0b1026;--bg2:#1b1147;--txt:#eef1ff;--mut:#a9b0d6;--glass:rgba(255,255,255,.08);--line:rgba(255,255,255,.18);--a:#ff7a6b;--b:#5eead4;--fld:rgba(8,12,34,.45);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg1:#e8ecff;--bg2:#f7e9ff;--txt:#161a3a;--mut:#555c86;--glass:rgba(255,255,255,.55);--line:rgba(60,70,140,.2);--fld:rgba(255,255,255,.7)}}
:root[data-theme="light"]{--bg1:#e8ecff;--bg2:#f7e9ff;--txt:#161a3a;--mut:#555c86;--glass:rgba(255,255,255,.55);--line:rgba(60,70,140,.2);--fld:rgba(255,255,255,.7)}

/* LATAR: gumpalan warna blur yang bergerak pelan */
.blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.55;z-index:0;pointer-events:none;animation:drift 18s ease-in-out infinite alternate}
.b1{width:420px;height:420px;background:var(--a);top:-120px;left:-100px}
.b2{width:460px;height:460px;background:var(--b);bottom:-160px;right:-120px;animation-delay:-9s}
@keyframes drift{to{transform:translate(60px,40px) scale(1.15)}}
@media (prefers-reduced-motion:reduce){.blob{animation:none}}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
h1{font-size:clamp(1.4rem,4vw,2.2rem);font-weight:800;margin:0;letter-spacing:-.02em}
header p{margin:4px 0 0;color:var(--mut);font-size:.9rem}
/* LAYOUT: 1 kolom di HP, 2 kolom di layar >= 900px */
.grid{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:900px){.grid{grid-template-columns:1.05fr 1fr;align-items:start}.out{position:sticky;top:16px}}
/* GAYA KACA (glassmorphism): transparan + blur */
.card{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:18px;backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);box-shadow:0 10px 40px rgba(0,0,0,.25)}
h2{font-size:1rem;margin:0 0 12px;font-weight:600}
.f{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:600px){.f{grid-template-columns:1fr 1fr}.full{grid-column:1/-1}}
label{display:block;font-size:.78rem;font-weight:600;margin-bottom:5px;color:var(--mut)}
input,select,textarea{width:100%;font:inherit;font-size:.92rem;color:var(--txt);background:var(--fld);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;transition:border-color .2s,box-shadow .2s}
select option{color:#111}

textarea{resize:vertical;min-height:70px}

.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.cnt{font-size:.75rem;color:var(--mut)}
.pre{display:flex;gap:8px;margin-bottom:10px}
.pre input{flex:1}
#list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 12px;font-size:.8rem;background:var(--fld)}
.chip button{padding:2px 8px;border-radius:999px;font-size:.75rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--txt);color:var(--bg1);padding:10px 18px;border-radius:999px;font-size:.85rem;font-weight:600;opacity:0;transition:.3s;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{color:var(--mut);font-size:.8rem}
.dd{margin-bottom:6px}.cat{margin:4px 0 14px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--fld)}
.cat label{color:var(--txt)}
</style>

---

# AUTO DETECTION GAMBAR

Periksa seluruh gambar yang dilampirkan pengguna.

Secara otomatis klasifikasikan menjadi:

- **REFERENCE** = contoh style, layout, mood, warna, atau komposisi
- **ASSET** = foto manusia, produk, objek, tempat, ilustrasi, atau elemen yang harus digunakan
- **LOGO** = logo brand
- **QR** = QR Code
- **OTHER** = elemen pendukung lain

Jika gambar berupa poster/desain jadi, anggap sebagai REFERENCE.

Jika gambar berupa foto objek/manusia/produk tanpa layout desain, anggap sebagai ASSET.

Jika ditemukan QR Code, gunakan sebagai QR asli.

Jika ditemukan logo, gunakan sebagai logo asli.

Jika pengguna tidak memberikan gambar apa pun, buat seluruh visual dari brief teks.

---

# FORMAT OTOMATIS

Jika FORMAT:

Story:
1080 × 1920 px
9:16

Feed:
1080 × 1350 px
4:5

Feed Square:
1080 × 1080 px
1:1

Poster:
rasio 210:297

Brosur:
rasio 210:297

Banner:
3:1

Banner Vertical:
1:3

Bendera:
3:2

Custom:
ikuti ukuran pengguna.

Layout harus dibuat ulang sesuai format.

Jangan hanya melakukan crop dari format lain.

---

# HIERARKI DESAIN

Prioritas visual:

1. JUDUL
2. VISUAL UTAMA
3. ISI PRIORITAS
4. CTA
5. KONTAK / QR
6. INFORMASI TAMBAHAN
7. ORNAMEN

Pastikan headline dapat terbaca dalam beberapa detik.

Visual utama harus menjadi focal point.

Informasi penting tidak boleh kalah oleh dekorasi.

---

# LOGIKA VISUAL

Jika pengguna melampirkan ASSET yang sesuai dengan VISUAL:
gunakan asset tersebut.

Jika tidak:
buat visual sesuai deskripsi VISUAL.

Jika VISUAL kosong:
tentukan visual paling relevan berdasarkan JUDUL, ISI, dan jenis desain.

Jangan menutupi wajah dengan teks.

Jangan crop wajah secara buruk.

Pastikan anatomi manusia natural.

Jika berupa produk:
produk harus terlihat jelas dan menjadi pusat perhatian.

---

# LOGIKA REFERENCE

Jika terdapat gambar REFERENCE:

pelajari:
- komposisi
- hierarki
- warna
- typography
- lighting
- framing
- spacing
- ornamen
- mood

Gunakan sebagai inspirasi visual.

Jangan menyalin secara identik.

Adaptasikan dengan brief pengguna.

---

# LOGIKA WARNA

Jika WARNA berisi 2 warna:

warna pertama = warna utama
warna kedua = warna sekunder

Contoh:

WARNA = biru navy + merah

maka:
- navy dominan
- merah sebagai highlight/aksen

Jika hanya satu warna:
buat otomatis:
- shade gelap
- shade terang
- warna netral
- warna aksen yang harmonis

Jika WARNA kosong:
tentukan palette profesional berdasarkan topik dan style.

---

# LOGIKA STYLE

Jika STYLE tersedia:
ikuti style tersebut.

Contoh:

Modern clean  
Corporate  
Luxury  
Premium  
Japanese modern  
Minimal  
Futuristic  
Energetic  
Elegant  
Friendly  
Youthful  
Editorial  

Jika STYLE kosong:

gunakan default:

**modern clean professional**

---

# TYPOGRAPHY

Gunakan typography yang sesuai dengan style.

Gunakan maksimal sekitar 2 keluarga font secara visual.

Buat perbedaan jelas antara:

- headline
- subheadline
- isi
- CTA
- kontak

Jangan membuat semua teks memiliki ukuran yang sama.

Headline harus dominan.

Tuliskan informasi penting dengan akurat.

Jangan mengubah:
- nama
- harga
- tanggal
- nomor
- username
- alamat
- data penting

---

# AUTO CONTACT SYSTEM

maka tampilkan:

[WhatsApp Icon] nomor

---

---

# AUTO QR SYSTEM

Jika terdapat gambar QR:

gunakan gambar tersebut.

Jangan generate ulang QR.

Jangan mengubah pola QR.

Jangan:
- blur
- distort
- crop
- rotate ekstrem
- memberi efek perspektif
- menutup bagian QR

Letakkan QR pada area bersih dengan kontras tinggi.

Sisakan quiet zone.

Jika relevan, tambahkan teks seperti:

Scan QR

atau

Scan untuk informasi lengkap

Jika tidak ada QR:
jangan membuat QR palsu.

---

# LOGO SYSTEM

Jika logo dilampirkan:

gunakan logo asli.

Jangan:
- mengganti teks logo
- mengubah simbol
- mengubah bentuk
- mendesain ulang

Tempatkan secara proporsional.

Jika tidak ada logo:
jangan membuat logo baru kecuali diminta.

---

# ORNAMEN

Jika ORNAMEN tersedia:
gunakan sesuai brief.

Jika kosong:
tambahkan ornamen minimal bila diperlukan.

Contoh:

- geometric shape
- gradient
- abstract shape
- line
- icon
- pattern
- glow
- texture
- cultural element

Ornamen harus mendukung desain.

Jangan membuat desain terlalu ramai.

---

# AUTO CTA

Jika CTA tersedia:
buat CTA terlihat jelas.

Contoh:

Daftar Sekarang  
Hubungi Sekarang  
Scan QR  
Pelajari Selengkapnya  

Jika CTA kosong:
jangan membuat CTA yang mengubah maksud desain.

---

# RESPONSIVE LAYOUT

Sesuaikan karakter desain berdasarkan FORMAT.

STORY:
- vertikal
- visual dominan
- headline besar
- CTA jelas

FEED:
- kuat sebagai thumbnail
- focal point jelas
- teks mudah dibaca di layar kecil

POSTER:
- headline besar
- hierarki kuat
- mudah dibaca dari jarak tertentu

BROSUR:
- informasi lebih detail
- gunakan grid
- kelompokkan konten

BANNER:
- teks besar
- informasi singkat
- cocok dibaca dari jauh

BENDERA:
- sangat sederhana
- high contrast
- minim teks
- fokus logo, simbol, atau headline

---

# SMART DEFAULT SYSTEM

Jika parameter kosong:

VISUAL kosong:
pilih visual paling relevan.

ORNAMEN kosong:
gunakan ornamen minimal.

STYLE kosong:
modern clean professional.

WARNA kosong:
pilih warna profesional sesuai konteks.

KONTAK kosong:
hilangkan area kontak.

QR kosong:
hilangkan area QR.

CTA kosong:
tidak perlu membuat CTA.

Jangan meminta klarifikasi jika brief sudah cukup untuk menghasilkan desain yang masuk akal.

Gunakan keputusan desain profesional.

---

# ATURAN KETAT

Jangan mengarang:

- nomor telepon
- harga
- tanggal
- nama orang
- alamat
- username
- QR
- diskon
- promo
- statistik
- klaim
- nama perusahaan

Jangan gunakan lorem ipsum.

Jangan menambahkan watermark.

Jangan membuat mockup HP, billboard, brosur cetak, kaos, papan iklan, atau device frame kecuali diminta.

Hasil harus berupa artwork desain secara langsung.

---

# INTERNAL DESIGN PROCESS

Sebelum menghasilkan gambar, lakukan secara internal:

analisis brief  
→ identifikasi gambar  
→ tentukan format  
→ tentukan hierarchy  
→ tentukan grid  
→ tentukan focal point  
→ tentukan warna  
→ tentukan typography  
→ tentukan posisi visual  
→ tentukan CTA  
→ tentukan kontak  
→ tentukan QR  
→ cek readability  
→ generate final design

Jangan tampilkan proses internal ini.

---

# OUTPUT TARGET

Buat hasil yang terasa seperti karya desainer profesional.

Target kualitas:

- professional
- polished
- clean
- balanced
- commercial-ready
- readable
- high visual hierarchy
- tidak terlihat seperti template generik
- tidak terlihat seperti elemen yang ditempel sembarangan

Urutan perhatian pengguna harus:

JUDUL  
→ VISUAL UTAMA  
→ ISI PRIORITAS  
→ CTA  
→ KONTAK / QR

Setelah memahami semua parameter dan gambar yang tersedia, langsung hasilkan desain final.`;
